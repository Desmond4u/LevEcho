name: Daily EOD update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: levecho-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch EOD data and publish snapshot
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            if python -m scripts.update_daily; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying in 30 minutes."
              sleep 1800
            fi
          done
          echo "All attempts failed."
          exit 2

      - name: Commit updated data
        run: |
          git add data/latest.json data/approved_pairs.json
          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily EOD snapshot"
          git push
