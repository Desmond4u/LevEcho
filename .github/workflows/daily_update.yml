name: Daily EOD update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: levecho-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch EOD data and publish snapshot
        run: python -m scripts.update_daily

      - name: Commit updated data
        run: |
          git add data/latest.json data/approved_pairs.json
          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily EOD snapshot"
          git push
